name: whim-microservices

services:
  whim-low-code:
    build:
      context: .
      args:
        APP_NAME: whim-low-code
    restart: unless-stopped
    environment:
      NODE_ENV: production
      RUNNING_ENV: dev
      TZ: Asia/Shanghai
    ports:
      - '3000:3000'
    volumes:
      - type: bind
        source: ./.config/.dev.yaml
        target: /app/.config/.dev.yaml
        read_only: true
        bind:
          create_host_path: false

  devops:
    build:
      context: .
      args:
        APP_NAME: devops
    restart: unless-stopped
    environment:
      NODE_ENV: production
      RUNNING_ENV: dev
      TZ: Asia/Shanghai
    ports:
      - '3001:3001'
    volumes:
      - type: bind
        source: ./.config/.dev.yaml
        target: /app/.config/.dev.yaml
        read_only: true
        bind:
          create_host_path: false

networks:
  default:
    name: whim-backend
    external: true
